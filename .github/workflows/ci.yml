name: CI - Validação e Testes Unitários

on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master

jobs:
  Test-and-Validate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🎨 Validar Formatação (Prettier)
        run: npm run format:check

      - name: 🔍 Análise Estática e Tipagem Estrita (ESLint)
        run: npm run lint

      - name: 🧪 Executar Testes Unitários e Cobertura (Vitest)
        run: npm run test:coverage

      - name: 📊 Upload Relatório de Cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-ci
          path: coverage/
          retention-days: 14

      - name: 🏗️ Validar Build de Produção
        run: npm run build
