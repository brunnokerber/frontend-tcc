<div class="container-fluid px-3 px-md-4">
  <!-- CABEÇALHO DA PÁGINA (Componente do Design System) -->
  <app-page-header
    title="Gestão de Doações"
    description="Controle de insumos arrecadados, rateio para lares e clínicas parceiras, e controle de doações monetárias"
    icon="volunteer_activism"
  >
    <div page-actions class="d-flex align-items-center flex-wrap gap-2">
      <button
        mat-flat-button
        color="primary"
        class="d-flex align-items-center gap-1 rounded-3 px-3 py-2"
        (click)="openDoacaoDialog()"
        type="button"
      >
        <mat-icon>add</mat-icon>
        <span class="fw-semibold">Nova Doação de Insumos</span>
      </button>

      <button
        mat-flat-button
        class="btn-action-monetaria d-flex align-items-center gap-1 rounded-3 px-3 py-2"
        (click)="openDoacaoMonetariaDialog()"
        type="button"
      >
        <mat-icon>payments</mat-icon>
        <span class="fw-semibold">Nova Doação em Dinheiro</span>
      </button>
    </div>
  </app-page-header>

  <!-- ABAS DO MÓDULO DE DOAÇÕES (COMPOSIÇÃO DE SUBCOMPONENTES) -->
  <mat-tab-group
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="onTabChange($event)"
    animationDuration="200ms"
    class="doacoes-tabs shadow-sm rounded-3"
  >
    <!-- ABA 1: DOAÇÕES E DISTRIBUIÇÃO DE INSUMOS -->
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="d-flex align-items-center gap-2 py-2">
          <mat-icon class="fs-5">inventory_2</mat-icon>
          <span class="fw-semibold">Insumos e Rateio</span>
        </div>
      </ng-template>

      <ng-template matTabContent>
        <app-doacoes-insumos-tab #insumosTab (dataChanged)="onDataChanged()" />
      </ng-template>
    </mat-tab>

    <!-- ABA 2: DOAÇÕES EM DINHEIRO (MONETÁRIAS) -->
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="d-flex align-items-center gap-2 py-2">
          <mat-icon class="fs-5">payments</mat-icon>
          <span class="fw-semibold">Doações em Dinheiro</span>
        </div>
      </ng-template>

      <ng-template matTabContent>
        <app-doacoes-monetarias-tab #monetariaTab (dataChanged)="onDataChanged()" />
      </ng-template>
    </mat-tab>

    <!-- ABA 3: CONSOLIDADO DE DIRECIONAMENTOS POR LOCAL -->
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="d-flex align-items-center gap-2 py-2">
          <mat-icon class="fs-5">local_shipping</mat-icon>
          <span class="fw-semibold">Direcionamentos por Local</span>
        </div>
      </ng-template>

      <ng-template matTabContent>
        <app-doacoes-direcionamentos-tab #direcionamentosTab (dataChanged)="onDataChanged()" />
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
