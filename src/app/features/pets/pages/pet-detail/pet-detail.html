<div class="container-fluid px-3 px-md-4 py-3 detail-page-container">
  <!-- Loading Geral -->
  @if (loadingPet()) {
    <div class="d-flex flex-column align-items-center justify-content-center py-5">
      <mat-spinner diameter="48"></mat-spinner>
      <p class="text-surface-muted mt-3 fw-medium">Carregando dados do animal...</p>
    </div>
  } @else if (pet(); as p) {
    <!-- Barra de Navegação Superior e Hero Card -->
    <app-pet-detail-header
      [pet]="p"
      [fotoUrl]="fotoUrl()"
      [totalInvestidoGeral]="totalInvestidoGeral()"
      [totalCustoVacinas]="totalCustoVacinas()"
      [totalCustoConsultas]="totalCustoConsultas()"
      [totalCustoAuxilio]="totalCustoAuxilio()"
      [diasNoAbrigo]="diasNoAbrigo()"
      (back)="goBack()"
      (adotar)="openAdotarModal()"
      (photoPreview)="openPhotoPreview($event)"
    />

    <!-- Grid Principal de Dados e Seções -->
    <div class="row g-4">
      <!-- COLUNA DA ESQUERDA: Cadastro e Origem (5 subseções) -->
      <div class="col-12 col-xl-4">
        <app-pet-info-card [pet]="p" (edit)="goToEdit()" />
      </div>

      <!-- COLUNA DA DIREITA: Vacinas, Procedimentos e Locais -->
      <div class="col-12 col-xl-8">
        <div class="d-flex flex-column gap-4">
          <!-- CARD 1: VACINAS -->
          <app-pet-vacinas-card
            [pet]="p"
            [vacinas]="vacinas()"
            [loading]="loadingVacinas()"
            [isAdmin]="isAdmin()"
            (addVacina)="openAddVacina()"
            (editVacina)="openEditVacina($event)"
            (deleteVacina)="confirmDeleteVacina($event)"
          />

          <!-- CARD 2: PROCEDIMENTOS, CONSULTAS & MEDICAMENTOS -->
          <app-pet-procedimentos-card
            [pet]="p"
            [consultas]="consultasExames()"
            [loading]="loadingConsultas()"
            [isAdmin]="isAdmin()"
            (addProcedimento)="openAddProcedimento()"
            (editProcedimento)="openEditProcedimento($event)"
            (deleteProcedimento)="confirmDeleteProcedimento($event)"
          />

          <!-- CARD 3: HISTÓRICO DE LOCAIS DE PASSAGEM -->
          <app-pet-locais-card
            [pet]="p"
            [locais]="petsLocais()"
            [loading]="loadingLocais()"
            (addLocal)="openAddLocal()"
            (editLocal)="openEditLocal($event)"
          />
        </div>
      </div>
    </div>
  }
</div>
