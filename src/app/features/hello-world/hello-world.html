<div class="container">
    <mat-card>

        <mat-card-header class="card-header-flex">

            <div>
                <mat-card-title>Mensagens do Supabase</mat-card-title>
                <mat-card-subtitle>Testando a conexão e o RLS</mat-card-subtitle>
            </div>

            <button mat-icon-button color="warn" (click)="sair()" title="Sair do sistema">
                <mat-icon>logout</mat-icon>
            </button>

        </mat-card-header>

        <mat-card-content>

            <div class="input-action-container">
                <mat-form-field appearance="outline" class="input-field">
                    <mat-label>Digite sua mensagem customizada</mat-label>
                    <input matInput [formControl]="mensagemControl" placeholder="Ex: Tudo funcionando perfeitamente!"
                        (keyup.enter)="enviarMensagem()"> <!-- Permite enviar dando Enter -->
                </mat-form-field>

                <button mat-flat-button color="primary" class="send-button" [disabled]="mensagemControl.invalid"
                    (click)="enviarMensagem()">
                    <mat-icon>send</mat-icon>
                    Enviar
                </button>
            </div>

            <hr />

            <mat-list>
                @for (item of mensagens(); track item.id) {
                <mat-list-item>
                    <mat-icon matListItemIcon>chat</mat-icon>
                    <span matListItemTitle>{{ item.message }}</span>
                    <span matListItemLine>Enviado em: {{ item.created_at | date:'dd/MM/yyyy HH:mm' }}</span>
                </mat-list-item>
                } @empty {
                <div class="empty-state">
                    <mat-icon>inbox</mat-icon>
                    <p>Nenhuma mensagem encontrada. Que tal inserir uma?</p>
                </div>
                }
            </mat-list>

        </mat-card-content>
    </mat-card>
</div>
