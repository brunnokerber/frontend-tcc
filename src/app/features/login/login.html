<div class="login-container">

  <h1 class="title">Peludinhos do Vale</h1>

  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>
        Seja bem-vindo ao login da Peludinhos do Vale
      </mat-card-title>
      <mat-card-subtitle>
        Insira seu email e senha abaixo
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="Ex: nome@dominio.com" autocomplete="true" id="email">
          <mat-error>{{ loginForm.controls.email | formError }}</mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>senha</mat-label>
          <input id="senha" matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password"
            placeholder="Ex: eyJhbGciOiJIUzI1..." autocomplete="true">
          <button mat-icon-button matSuffix (click)="togglePassword()" type="button" [attr.aria-label]="'Ocultar senha'"
            [attr.aria-pressed]="hidePassword()">
            <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error>{{ loginForm.controls.email | formError }}</mat-error>

        </mat-form-field>

        @if (errorMessage()) {
        <div class="api-error">
          {{ errorMessage() }}
        </div>
        }

        <button mat-flat-button type="submit" [disabled]="loginForm.invalid || isLoading()">
          {{ isLoading() ? 'Validating...' : 'Login' }}
        </button>

      </form>
    </mat-card-content>
  </mat-card>

</div>
