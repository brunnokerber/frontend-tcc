<mat-sidenav-container class="layout-sidenav-container" [hasBackdrop]="true">
  <!-- Sidenav Lateral do Usuário & Preferências (Abre pela direita) -->
  <mat-sidenav
    #userSidenav
    position="end"
    mode="over"
    class="user-sidenav shadow-lg"
    [opened]="userSidenavOpen()"
    (openedChange)="userSidenavOpen.set($event)"
  >
    <app-user-sidenav (close)="closeUserSidenav()" />
  </mat-sidenav>

  <!-- Conteúdo Principal da Aplicação -->
  <mat-sidenav-content class="layout-sidenav-content d-flex flex-column min-vh-100">
    <!-- Navbar Superior -->
    <app-main-navbar (openUserSidenav)="openUserSidenav()" />

    <!-- Conteúdo Principal -->
    <main class="main-content flex-grow-1 py-3 py-md-4">
      <router-outlet></router-outlet>
    </main>

    <!-- Rodapé -->
    <app-main-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
