<div
  class="app-dialog-container d-flex flex-column"
  [ngClass]="'dialog-size-' + size"
>
  <!-- Cabeçalho Customizado (Projetado) ou Cabeçalho Padrão -->
  <header class="dialog-header px-3 py-3 px-md-4 border-bottom border-surface">
    <ng-content select="[dialog-header]">
      <!-- Fallback: Cabeçalho Padrão Estruturado -->
      <div class="d-flex align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3 overflow-hidden">
          @if (icon) {
            <div
              class="dialog-icon-box rounded-3 d-flex align-items-center justify-content-center flex-shrink-0"
              [ngClass]="'dialog-icon-' + iconVariant"
            >
              <mat-icon>{{ icon }}</mat-icon>
            </div>
          }

          <div class="header-text-group overflow-hidden">
            @if (title) {
              <h2 class="dialog-title h5 fw-bold mb-0 text-truncate text-surface-main">
                {{ title }}
              </h2>
            }
            @if (subtitle) {
              <span class="dialog-subtitle small text-surface-muted d-block text-truncate">
                {{ subtitle }}
              </span>
            }
          </div>
        </div>

        <div class="d-flex align-items-center gap-1 flex-shrink-0">
          <ng-content select="[dialog-header-actions]"></ng-content>

          @if (showClose) {
            <button
              mat-icon-button
              type="button"
              (click)="onCloseClick()"
              [disabled]="closeDisabled"
              matTooltip="Fechar"
              aria-label="Fechar janela"
              class="dialog-close-btn"
            >
              <mat-icon>close</mat-icon>
            </button>
          }
        </div>
      </div>
    </ng-content>
  </header>

  <!-- Corpo do Diálogo / Conteúdo Principal -->
  <main
    class="dialog-body px-3 px-md-4 py-3"
    [class.dialog-scrollable]="scrollable"
    [ngClass]="bodyClass"
    [style.max-height]="maxBodyHeight || null"
  >
    <ng-content></ng-content>
  </main>

  <!-- Rodapé / Barra de Ações -->
  <footer class="dialog-footer px-3 py-3 px-md-4 border-top border-surface bg-surface-subtle">
    <div class="dialog-actions-wrapper d-flex align-items-center justify-content-end gap-2 flex-wrap">
      <ng-content select="[dialog-actions], [dialog-footer]"></ng-content>
    </div>
  </footer>
</div>
