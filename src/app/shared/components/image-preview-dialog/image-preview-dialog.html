<app-dialog-layout
  [title]="data.title || 'Foto do Pet'"
  [subtitle]="data.subtitle"
  icon="photo"
  iconVariant="primary"
  size="lg"
  [scrollable]="false"
  (close)="close()"
>
  <a
    dialog-header-actions
    [href]="data.imageUrl"
    target="_blank"
    rel="noopener noreferrer"
    mat-icon-button
    matTooltip="Abrir imagem em nova aba"
    aria-label="Abrir imagem em nova aba"
  >
    <mat-icon>open_in_new</mat-icon>
  </a>

  <!-- Corpo com Imagem Ampliada -->
  <div
    class="image-preview-body p-2 p-md-3 d-flex align-items-center justify-content-center position-relative"
  >
    @if (!isLoaded() && !hasError()) {
      <div
        class="loading-overlay d-flex flex-column align-items-center justify-content-center py-5"
      >
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando imagem...</span>
        </div>
        <span class="small text-surface-muted mt-2">Carregando imagem em alta resolução...</span>
      </div>
    }

    @if (hasError()) {
      <div class="text-center py-5 text-surface-muted">
        <mat-icon class="text-danger mb-2 error-icon">broken_image</mat-icon>
        <p class="mb-0 fw-medium">Não foi possível carregar a imagem ampliada.</p>
        <span class="small text-surface-muted"
          >O link temporário pode ter expirado. Tente recarregar a página.</span
        >
      </div>
    } @else {
      <img
        [src]="data.imageUrl"
        [alt]="data.title || 'Foto do Pet'"
        class="img-fluid rounded-3 preview-image shadow-sm"
        [class.d-none]="!isLoaded()"
        (load)="onImageLoad()"
        (error)="onImageError()"
      />
    }
  </div>

  <!-- Rodapé com botão Fechar -->
  <div dialog-actions>
    <button type="button" mat-stroked-button (click)="close()">Fechar</button>
  </div>
</app-dialog-layout>
