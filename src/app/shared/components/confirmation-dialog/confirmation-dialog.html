<app-dialog-layout
  [title]="data.title || 'Confirmar Ação'"
  [icon]="data.icon || (data.isDestructive !== false ? 'warning' : 'help_outline')"
  [iconVariant]="data.isDestructive !== false ? 'warn' : 'primary'"
  size="sm"
  [scrollable]="false"
  (close)="onCancel()"
>
  <!-- Mensagem de Confirmação -->
  <div class="confirm-message py-1">
    <p class="text-surface-main mb-0">{{ data.message }}</p>
  </div>

  <!-- Ações no rodapé -->
  <div dialog-actions>
    <button mat-stroked-button (click)="onCancel()" type="button">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button
      mat-flat-button
      [color]="data.confirmColor || (data.isDestructive !== false ? 'warn' : 'primary')"
      (click)="onConfirm()"
      type="button"
      class="px-3"
    >
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>
</app-dialog-layout>
