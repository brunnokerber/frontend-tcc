<div class="confirm-dialog-container p-2 p-md-3">
  <!-- Topo com Ícone e Título -->
  <div class="d-flex align-items-center gap-3 mb-3">
    <div
      class="confirm-icon-box rounded-circle d-flex align-items-center justify-content-center"
      [class.bg-warn-subtle]="data.isDestructive !== false"
      [class.text-danger]="data.isDestructive !== false"
      [class.bg-primary-subtle]="data.isDestructive === false"
      [class.text-primary]="data.isDestructive === false"
    >
      <mat-icon>{{ data.icon || (data.isDestructive !== false ? 'warning' : 'help_outline') }}</mat-icon>
    </div>
    <div>
      <h2 class="h5 fw-bold mb-0">{{ data.title || 'Confirmar Ação' }}</h2>
    </div>
  </div>

  <!-- Mensagem de Confirmação -->
  <div class="confirm-message mb-4">
    <p class="text-surface-main mb-0">{{ data.message }}</p>
  </div>

  <!-- Ações -->
  <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top">
    <button mat-stroked-button (click)="onCancel()" type="button">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button
      mat-flat-button
      [color]="data.confirmColor || (data.isDestructive !== false ? 'warn' : 'primary')"
      (click)="onConfirm()"
      type="button"
      class="px-3"
    >
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>
</div>
